name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *" # ~03:17 BRT daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py
      - run: python scripts/fetch_status.py
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/render_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: atualiza gráfico, trilha e status [skip ci]"
          file_pattern: "data/*.json *.svg"
